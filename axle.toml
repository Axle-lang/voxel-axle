[package]
name = "voxel"
version = "0.1.0"

[dependencies]
# The platform layer: window, event queue, framebuffer blit, monotonic
# clock, software audio mixer, whole-file reads and raw buffers. Written
# in Axle, calling Win32 or X11 + ALSA directly depending on the build's
# target. There is no `[link]` section here because there is nothing to
# put in one: every library the link line needs is named by the
# `extern "C" from "…"` block inside smalt that imports from it.
smalt = { path = "../smalt" }
